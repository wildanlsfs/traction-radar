<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traction Radar</title>
  <meta name="description" content="Find where your app's first users will come from, run small experiments, and learn from real outcomes." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/><circle cx="22" cy="10" r="3" fill="var(--hot)"/></svg>
        <span>Traction Radar</span>
      </a>
      <button class="btn primary wide" id="newProductBtn">Add a product</button>
      <nav id="productList" aria-label="Products"></nav>
      <div class="rail-foot">
        <a href="#/bank">Traction bank</a>
        <a href="#/settings">Settings</a>
      </div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="newProduct">
    <form method="dialog" id="newProductForm">
      <h2>Which product needs users?</h2>
      <label>Product URL <input name="url" type="url" placeholder="https://yourapp.com" /></label>
      <label>What it does, in your words <textarea name="notes" rows="4" placeholder="Who it's for, what it costs, anything the landing page doesn't say."></textarea></label>
      <p class="hint">The agent reads the page, scans public conversations on Threads and the web, then proposes three experiments. Nothing is posted without your approval.</p>
      <div class="row end">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Start the radar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
